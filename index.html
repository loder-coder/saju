<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Blueprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#8b5cf6',
                        wood: '#10b981', // Green
                        fire: '#ef4444', // Red
                        earth: '#d97706', // Amber
                        metal: '#94a3b8', // Slate
                        water: '#3b82f6', // Blue
                    }
                }
            }
        }
    </script>
    <style>
        .element-bar { transition: width 1s ease-in-out; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-dark text-gray-100 min-h-screen font-sans antialiased selection:bg-accent selection:text-white">
    <div class="max-w-2xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="mb-8 text-center cursor-pointer" onclick="window.location.href='/'">
            <h1 class="text-3xl md:text-5xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
                Elemental Blueprint
            </h1>
            <p class="text-gray-400 text-sm md:text-base">Discover Your Energy Signature</p>
        </header>

        <!-- Dynamic Loading Overlay -->
        <div id="loading" class="hidden fixed inset-0 bg-dark/95 z-50 flex flex-col items-center justify-center backdrop-blur-md transition-opacity duration-300">
            <div class="relative">
                <div class="animate-spin rounded-full h-20 w-20 border-t-2 border-b-2 border-accent mb-4"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fa-solid fa-star text-accent/50 text-xl animate-pulse"></i>
                </div>
            </div>
            <p id="loadingText" class="text-accent font-serif text-xl tracking-wider animate-pulse mt-4">Consulting the Stars...</p>
            <p class="text-gray-500 text-sm mt-2">This may take a moment</p>
        </div>

        <!-- Share Modal -->
        <div id="shareModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm px-4">
            <div class="bg-card border border-gray-600 p-6 rounded-3xl shadow-2xl max-w-sm w-full text-center fade-in transform transition-all">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-900/30 mb-6 border border-green-500/30">
                    <i class="fa-solid fa-check text-green-400 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">Link Copied!</h3>
                <p class="text-gray-400 text-sm mb-6">The analysis link is ready to share.</p>
                <div class="bg-dark/50 p-3 rounded-xl border border-gray-700 mb-6 break-all text-xs text-accent font-mono select-all cursor-text text-center">
                    <span id="shareUrlText">https://...</span>
                </div>
                <button onclick="closeModal()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 rounded-xl transition duration-200">
                    Done
                </button>
            </div>
        </div>

        <!-- Input Form Section -->
        <div id="inputSection" class="bg-card p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-700/50">
            <h2 class="text-xl font-semibold mb-6 flex items-center gap-2 text-white">
                <i class="fa-solid fa-compass text-accent"></i> Enter Details
            </h2>

            <form id="sajuForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Birth Date</label>
                        <input type="date" id="birth_date" required
                            class="w-full bg-dark/50 border border-gray-600 rounded-xl p-3 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Birth Time</label>
                        <input type="time" id="birth_time" required
                            class="w-full bg-dark/50 border border-gray-600 rounded-xl p-3 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Location (Timezone)</label>
                    <select id="timezone" class="w-full bg-dark/50 border border-gray-600 rounded-xl p-3 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none transition-all">
                        <option value="Asia/Seoul">Seoul (Korea)</option>
                        <option value="America/New_York" selected>New York (Eastern Time)</option>
                        <option value="America/Los_Angeles">Los Angeles (Pacific Time)</option>
                        <option value="Europe/London">London (GMT)</option>
                    </select>
                </div>

                <div class="hidden">
                    <input type="number" id="longitude" value="-74.0060">
                </div>

                <div class="flex items-center justify-between bg-dark/30 p-4 rounded-xl border border-gray-600/30">
                    <label class="flex items-center cursor-pointer gap-3 select-none w-full">
                        <div class="relative">
                            <input type="checkbox" id="include_analysis" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-accent"></div>
                        </div>
                        <span class="text-sm font-medium text-gray-300">Include AI Life Analysis</span>
                    </label>
                    <i class="fa-solid fa-wand-magic-sparkles text-accent"></i>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-violet-900/20 transform transition hover:scale-[1.01] active:scale-95 text-lg">
                    Reveal My Blueprint
                </button>
            </form>
        </div>

        <!-- Result Section (Hidden by default) -->
        <div id="resultSection" class="hidden space-y-6 fade-in">
            <!-- Share Bar -->
            <div class="flex justify-end mb-2">
                <button onclick="shareResult()" class="text-sm text-accent hover:text-white transition flex items-center gap-2 bg-card px-4 py-2 rounded-full border border-gray-700 shadow-lg hover:bg-gray-700">
                    <i class="fa-solid fa-share-nodes"></i> Share Result
                </button>
            </div>

            <!-- Main Card -->
            <div class="bg-card rounded-3xl overflow-hidden shadow-2xl border border-gray-700/50">
                <!-- Day Master Title -->
                <div class="bg-gradient-to-r from-violet-900/50 to-indigo-900/50 p-8 text-center border-b border-gray-700/50">
                    <p class="text-gray-400 text-sm uppercase tracking-widest mb-2">Your Core Archetype</p>
                    <h2 id="dayMaster" class="text-3xl md:text-4xl font-serif font-bold text-white mb-2"></h2>
                    <p id="birthDetails" class="text-gray-400 text-sm font-mono"></p>
                </div>

                <div class="p-6 md:p-8 space-y-8">
                    <!-- 5 Elements Chart -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-200 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-chart-simple text-gray-400"></i> Elemental Balance
                        </h3>
                        <div class="space-y-3" id="elementsChart">
                            <!-- JS will inject bars here -->
                        </div>
                    </div>

                    <!-- AI Analysis -->
                    <div id="aiSection" class="bg-dark/50 rounded-2xl p-6 border border-gray-700/50">
                        <h3 class="text-lg font-semibold text-gray-200 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-robot text-accent"></i> AI Insight
                        </h3>
                        <div id="aiContent" class="text-gray-300 text-sm leading-relaxed whitespace-pre-line font-light">
                            <!-- AI Text -->
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="window.location.href='/'" class="w-full py-4 text-gray-400 hover:text-white transition">
                Analyze Another Person
            </button>
        </div>
    </div>

    <script>
        // --- 1. 유틸리티 및 초기화 ---
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('id');
        let loadingInterval;

        // 로딩 메시지 목록
        const loadingMessages = [
            "Aligning the Stars...",
            "Calculating Elemental Balance...",
            "Decoding Your Energy Signature...",
            "Consulting the AI Oracle...",
            "Finalizing Your Blueprint..."
        ];

        // 기본값 설정
        const now = new Date();
        document.getElementById('birth_date').valueAsDate = now;
        document.getElementById('birth_time').value = now.toTimeString().substring(0,5);

        // --- 2. 로딩 관리 함수 ---
        function showLoading() {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            loading.classList.remove('hidden');

            let i = 0;
            loadingText.textContent = loadingMessages[0];

            // 0.8초마다 메시지 변경
            loadingInterval = setInterval(() => {
                i = (i + 1) % loadingMessages.length;
                loadingText.textContent = loadingMessages[i];
            }, 800);
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            loading.classList.add('hidden');
            clearInterval(loadingInterval);
        }

        // --- 3. 페이지 로드 시 로직 ---
        if (recordId) {
            fetchRecord(recordId);
        }

        // --- 4. 이벤트 리스너 ---
        document.getElementById('timezone').addEventListener('change', function(e) {
            const tz = e.target.value;
            const longInput = document.getElementById('longitude');
            if(tz === 'Asia/Seoul') longInput.value = 127.0;
            if(tz === 'America/New_York') longInput.value = -74.0060;
            if(tz === 'America/Los_Angeles') longInput.value = -118.2437;
            if(tz === 'Europe/London') longInput.value = -0.1276;
        });

        document.getElementById('sajuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(); // 로딩 시작

            const payload = {
                birth_date: document.getElementById('birth_date').value,
                birth_time: document.getElementById('birth_time').value,
                timezone: document.getElementById('timezone').value,
                longitude: parseFloat(document.getElementById('longitude').value),
                latitude: 0.0,
                include_analysis: document.getElementById('include_analysis').checked
            };

            try {
                const response = await fetch('/saju', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if(data.record_id) {
                    const newUrl = `${window.location.pathname}?id=${data.record_id}`;
                    window.history.pushState({path: newUrl}, '', newUrl);
                }

                renderResult(data);

            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                hideLoading(); // 로딩 종료
            }
        });

        // --- 5. 데이터 조회 및 렌더링 함수 ---
        async function fetchRecord(id) {
            showLoading(); // 로딩 시작
            try {
                const response = await fetch(`/saju/${id}`);
                if (!response.ok) throw new Error("Record not found");
                const data = await response.json();
                renderResult(data);
            } catch (err) {
                alert("Could not load record. It might have been deleted.");
                window.location.href = '/';
            } finally {
                hideLoading(); // 로딩 종료
            }
        }

        function renderResult(data) {
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');

            const dayPillar = data.saju.day;
            const stemMap = {'甲':'Yang Wood', '乙':'Yin Wood', '丙':'Yang Fire', '丁':'Yin Fire', '戊':'Yang Earth', '己':'Yin Earth', '庚':'Yang Metal', '辛':'Yin Metal', '壬':'Yang Water', '癸':'Yin Water'};
            const branchMap = {'子':'Rat', '丑':'Ox', '寅':'Tiger', '卯':'Rabbit', '辰':'Dragon', '巳':'Snake', '午':'Horse', '未':'Sheep', '申':'Monkey', '酉':'Rooster', '戌':'Dog', '亥':'Pig'};

            const stem = dayPillar[0];
            const branch = dayPillar[1];
            const engTitle = `${stemMap[stem] || stem} ${branchMap[branch] || branch}`;

            document.getElementById('dayMaster').textContent = engTitle;
            document.getElementById('birthDetails').textContent = `${data.input.birth_date} ${data.input.birth_time} (${data.input.timezone})`;

            const elContainer = document.getElementById('elementsChart');
            elContainer.innerHTML = '';
            const colors = { 'Wood': 'bg-wood', 'Fire': 'bg-fire', 'Earth': 'bg-earth', 'Metal': 'bg-metal', 'Water': 'bg-water' };
            const icons = { 'Wood': 'fa-tree', 'Fire': 'fa-fire', 'Earth': 'fa-mountain', 'Metal': 'fa-gavel', 'Water': 'fa-water' };

            const maxVal = Math.max(...Object.values(data.elements));

            for (const [elm, count] of Object.entries(data.elements)) {
                const percent = maxVal > 0 ? (count / 8) * 100 : 0;
                const displayWidth = Math.max(percent, 5);

                const row = document.createElement('div');
                row.className = 'flex items-center gap-4';
                row.innerHTML = `
                    <div class="w-20 text-xs font-semibold text-gray-400 flex items-center gap-2">
                        <i class="fa-solid ${icons[elm]} w-4"></i> ${elm}
                    </div>
                    <div class="flex-1 bg-dark rounded-full h-4 overflow-hidden relative">
                        <div class="${colors[elm]} h-full rounded-full element-bar flex items-center justify-end px-2" style="width: ${displayWidth}%">
                            <span class="text-[10px] font-bold text-white/90">${count}</span>
                        </div>
                    </div>
                `;
                elContainer.appendChild(row);
            }

            const aiContent = document.getElementById('aiContent');
            if (data.analysis) {
                document.getElementById('aiSection').classList.remove('hidden');
                aiContent.innerText = data.analysis.replace(/\*\*/g, '').replace(/###/g, '');
            } else {
                document.getElementById('aiSection').classList.add('hidden');
            }
        }

        // --- 6. 공유 기능 ---
        async function shareResult() {
            const url = window.location.href;
            const shareData = {
                title: 'My Elemental Blueprint',
                text: 'Check out my energy signature analysis! 🔮',
                url: url
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return;
                } catch (err) {
                    console.log('Share API canceled or failed, falling back to modal.');
                }
            }

            try {
                await navigator.clipboard.writeText(url);
                showModal(url);
            } catch (err) {
                showModal(url);
            }
        }

        function showModal(url) {
            const modal = document.getElementById('shareModal');
            const urlText = document.getElementById('shareUrlText');
            urlText.textContent = url;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('shareModal');
            modal.classList.add('hidden');
        }

        document.getElementById('shareModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
