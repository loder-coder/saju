<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Blueprint Debugger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#8b5cf6', // Violet
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-gray-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
                Elemental Blueprint
            </h1>
            <p class="text-gray-400">Saju Engine Debugger for Global Market</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Input Form -->
            <div class="bg-card p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-accent"></i> Input Parameters
                </h2>

                <form id="sajuForm" class="space-y-4">
                    <!-- Date & Time -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Birth Date</label>
                            <input type="date" id="birth_date" required
                                class="w-full bg-dark border border-gray-600 rounded-lg p-2.5 focus:border-accent focus:outline-none transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Birth Time</label>
                            <input type="time" id="birth_time" required
                                class="w-full bg-dark border border-gray-600 rounded-lg p-2.5 focus:border-accent focus:outline-none transition-colors">
                        </div>
                    </div>

                    <!-- Timezone -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Timezone</label>
                        <select id="timezone" class="w-full bg-dark border border-gray-600 rounded-lg p-2.5 focus:border-accent focus:outline-none transition-colors">
                            <option value="Asia/Seoul">Seoul (Asia/Seoul)</option>
                            <option value="America/New_York" selected>New York (America/New_York)</option>
                            <option value="America/Los_Angeles">Los Angeles (America/Los_Angeles)</option>
                            <option value="Europe/London">London (Europe/London)</option>
                        </select>
                    </div>

                    <!-- Longitude -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">
                            Longitude (Degrees)
                            <span class="text-xs text-gray-500 block">East(+), West(-) | e.g. NY: -74.0</span>
                        </label>
                        <input type="number" step="0.0001" id="longitude" value="-74.0060"
                            class="w-full bg-dark border border-gray-600 rounded-lg p-2.5 focus:border-accent focus:outline-none transition-colors">
                    </div>

                    <!-- AI Analysis Toggle -->
                    <div class="flex items-center justify-between bg-dark/50 p-3 rounded-lg border border-gray-600/50">
                        <label class="flex items-center cursor-pointer gap-2 select-none">
                            <div class="relative">
                                <input type="checkbox" id="include_analysis" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-accent rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-accent"></div>
                            </div>
                            <span class="text-sm font-medium text-gray-300">Include AI Analysis</span>
                        </label>
                        <span class="text-xs text-gray-500"><i class="fa-solid fa-robot"></i> Gemini/GPT</span>
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg transform transition hover:scale-[1.02]">
                        Analyze Blueprint
                    </button>
                </form>
            </div>

            <!-- Result Display -->
            <div class="bg-card p-6 rounded-2xl shadow-xl border border-gray-700 relative overflow-hidden flex flex-col h-[600px]">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 flex-shrink-0">
                    <i class="fa-solid fa-code text-green-400"></i> JSON Response
                </h2>

                <!-- Loading Spinner -->
                <div id="loading" class="hidden absolute inset-0 bg-card/90 flex items-center justify-center z-10">
                    <div class="flex flex-col items-center gap-3">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent"></div>
                        <p class="text-sm text-gray-400 animate-pulse">Consulting the Stars...</p>
                    </div>
                </div>

                <!-- Content -->
                <div id="resultArea" class="flex-1 overflow-auto bg-dark rounded-lg p-4 font-mono text-sm text-green-400 whitespace-pre">
                    // Result will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set default date/time to now
        const now = new Date();
        document.getElementById('birth_date').valueAsDate = now;
        document.getElementById('birth_time').value = now.toTimeString().substring(0,5);

        // Handle Timezone Change -> Auto update longitude (approx)
        document.getElementById('timezone').addEventListener('change', function(e) {
            const tz = e.target.value;
            const longInput = document.getElementById('longitude');
            if(tz === 'Asia/Seoul') longInput.value = 127.0;
            if(tz === 'America/New_York') longInput.value = -74.0060;
            if(tz === 'America/Los_Angeles') longInput.value = -118.2437;
            if(tz === 'Europe/London') longInput.value = -0.1276;
        });

        // Submit Handler
        document.getElementById('sajuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');

            loading.classList.remove('hidden');
            resultArea.textContent = 'Calculating...';

            // 체크박스 상태 확인
            const isAnalysisIncluded = document.getElementById('include_analysis').checked;

            const payload = {
                birth_date: document.getElementById('birth_date').value,
                birth_time: document.getElementById('birth_time').value,
                timezone: document.getElementById('timezone').value,
                longitude: parseFloat(document.getElementById('longitude').value),
                latitude: 0.0,
                include_analysis: isAnalysisIncluded // 요청에 추가
            };

            try {
                const response = await fetch('/saju', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                resultArea.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                resultArea.textContent = 'Error: ' + err.message;
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
